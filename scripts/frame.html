<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      html, body { margin: 0; background: #000; overflow: hidden; }
      iframe { display: block; border: 0; }
    </style>
  </head>
  <body>
    <iframe id="f"></iframe>
    <script>
      const p = new URLSearchParams(location.search);
      const f = document.getElementById('f');
      f.width = p.get('w');
      f.height = p.get('h');
      f.src = p.get('src');
    </script>
  </body>
</html>
